name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      SECRET_KEY: test-secret-key-for-ci-only
      API_FOOTBALL_KEY: test-football-key
      NBA_API_KEY: test-nba-key
      ANTHROPIC_API_KEY: ""
      FLASK_DEBUG: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify model release
        run: python scripts/model_artifacts.py

      - name: Lint conflict-tooling surface (ruff)
        run: ruff check scripts/resolve_app_conflict.py tests/test_conflict_resolver.py --select E,W,F --ignore E501 --output-format=github

      - name: Run tests
        run: pytest tests -q --tb=short

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run build
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm --prefix frontend run test:e2e
